<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de descarga de remitos</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2d;
      --panel-2: #11243a;
      --border: #203650;
      --text: #edf4fb;
      --muted: #91a5bb;
      --accent: #2da8ff;
      --accent-soft: rgba(45, 168, 255, .15);
      --ok: #32c48d;
      --warn: #f5b942;
      --danger: #ef6b73;
      --shadow: 0 18px 45px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(45,168,255,.12), transparent 28%),
        linear-gradient(180deg, #07111f 0%, #091522 100%);
      color: var(--text);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
    }

    .container {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(1.45rem, 2.5vw, 2.2rem);
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: .92rem;
    }

    .refresh-button {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-button:hover { border-color: var(--accent); }
    .refresh-button:disabled { opacity: .55; cursor: wait; }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .card, .filters, .table-panel, .error-box {
      background: rgba(13, 27, 45, .94);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 14px;
    }

    .card {
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card-label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
    .card-value { margin-top: 7px; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 800; }
    .card-value.small { font-size: 1rem; line-height: 1.4; }

    .filters {
      padding: 16px;
      margin-bottom: 14px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr) auto;
      gap: 14px;
      align-items: end;
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }


    .days {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 108px;
      overflow: auto;
      padding-right: 4px;
    }

    .day-button {
      border: 1px solid var(--border);
      background: #091727;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: .84rem;
      white-space: nowrap;
    }

    .day-button.active,
    .destination-button.active,
    .status-filter-button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #dff3ff;
      font-weight: 800;
    }

    .destinations {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 108px;
      overflow: auto;
      padding-right: 4px;
    }

    .destination-button,
    .status-filter-button {
      border: 1px solid var(--border);
      background: #091727;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: .84rem;
      white-space: nowrap;
    }


    .filter-select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      background: #091727;
      color: var(--text);
      border-radius: 9px;
      padding: 0 12px;
      font-size: .88rem;
      outline: none;
      cursor: pointer;
    }

    .filter-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .clear-button {
      height: 42px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 9px;
      padding: 0 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .table-panel { overflow: hidden; }

    .table-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
    }

    .table-title { font-weight: 800; }
    .table-count { color: var(--muted); font-size: .86rem; }

    .table-wrap {
      overflow: auto;
      max-height: 68vh;
    }

    table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: auto;
      font-size: .78rem;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #10243a;
      color: #bdd0e2;
      text-align: center;
      padding: 10px 7px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 7px;
      border-bottom: 1px solid rgba(32, 54, 80, .65);
      text-align: center;
      vertical-align: middle;
      line-height: 1.28;
    }

    th:nth-child(1), td:nth-child(1) { width: 88px; min-width: 88px; }
    th:nth-child(2), td:nth-child(2) { width: 150px; min-width: 130px; }
    th:nth-child(3), td:nth-child(3) { width: 175px; min-width: 145px; }
    th:nth-child(4), td:nth-child(4) { width: 250px; min-width: 210px; }
    th:nth-child(5), td:nth-child(5) { width: 82px; min-width: 82px; }
    th:nth-child(6), td:nth-child(6) { width: 126px; min-width: 126px; white-space: nowrap; }
    th:nth-child(7), td:nth-child(7) { width: 115px; min-width: 95px; }
    th:nth-child(8), td:nth-child(8) { width: 68px; min-width: 68px; white-space: nowrap; }
    th:nth-child(9), td:nth-child(9) { width: 118px; min-width: 118px; white-space: nowrap; }

    td:nth-child(2),
    td:nth-child(3),
    td:nth-child(4),
    td:nth-child(7) {
      white-space: normal;
      overflow-wrap: break-word;
      word-break: normal;
    }

    tbody tr:hover { background: rgba(45, 168, 255, .055); }

    .text-left { text-align: left; }
    .muted { color: var(--muted); }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: .75rem;
      font-weight: 800;
      white-space: nowrap;
      background: rgba(145,165,187,.13);
      color: #c8d5e1;
    }

    .status.ok { background: rgba(50,196,141,.14); color: #68e0b2; }
    .status.warn { background: rgba(245,185,66,.14); color: #ffd275; }

    .loading {
      padding: 42px 18px;
      text-align: center;
      color: var(--muted);
    }

    .error-box {
      display: none;
      padding: 16px;
      margin-bottom: 14px;
      border-color: rgba(239,107,115,.55);
      color: #ffc2c6;
    }

    @media (max-width: 920px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-grid { grid-template-columns: 1fr; }
      .clear-button { width: 100%; }
    }

    @media (max-width: 560px) {
      .container { width: min(100% - 18px, 1500px); padding-top: 15px; }
      .header { align-items: stretch; flex-direction: column; }
      .refresh-button { width: 100%; }
      .cards { grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { padding: 13px 11px; }
      .card-label { font-size: .68rem; }
      .card-value { font-size: 1.35rem; }
      .card-value.small { font-size: .82rem; }
      .filters { padding: 13px; }
      .table-wrap { max-height: 63vh; }
      table { font-size: .74rem; min-width: 1080px; }
      th { padding: 9px 6px; }
      td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Estado de descarga de remitos</h1>
        <div class="subtitle" id="updatedText">Cargando información...</div>
      </div>
      <button class="refresh-button" id="refreshButton" type="button">Actualizar datos</button>
    </header>

    <div class="error-box" id="errorBox"></div>

    <section class="cards">
      <article class="card">
        <div class="card-label">Registros filtrados</div>
        <div class="card-value" id="recordsCard">0</div>
      </article>
      <article class="card">
        <div class="card-label">Remitos falta descargar</div>
        <div class="card-value" id="pendingCard">0</div>
      </article>
    </section>

    <section class="filters">
      <div class="filter-grid">
        <div class="filter-group">
          <label>Días</label>
          <select class="filter-select" id="daysContainer"></select>
        </div>
        <div class="filter-group">
          <label>Destino</label>
          <select class="filter-select" id="destinationsContainer"></select>
        </div>
        <div class="filter-group">
          <label>Estado de descarga</label>
          <select class="filter-select" id="statusContainer"></select>
        </div>
        <button class="clear-button" id="clearButton" type="button">Limpiar filtros</button>
      </div>
    </section>

    <section class="table-panel">
      <div class="table-header">
        <div class="table-title">Detalle de registros</div>
        <div class="table-count" id="tableCount">0 registros</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>REMITO MONTE</th>
              <th>DESTINO</th>
              <th>PREDIO</th>
              <th>PRODUCTO</th>
              <th>VEHÍCULO</th>
              <th>FIN CARGA</th>
              <th>OBSERVACIONES</th>
              <th>NETO</th>
              <th>ESTADO DESCARGA</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="9" class="loading">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const DATA_URL = "https://dl.dropbox.com/scl/fi/eo971dn4yrjz5h71qkh2b/EstadoDescargaRemitos.json?rlkey=j5udth4t07t8vpaoyqel87j93&dl=1";

    let allRecords = [];
    let selectedDay = "";
    let selectedDestination = "";
    let selectedStatus = "";

    const daysContainer = document.getElementById("daysContainer");
    const destinationsContainer = document.getElementById("destinationsContainer");
    const statusContainer = document.getElementById("statusContainer");
    const clearButton = document.getElementById("clearButton");
    const refreshButton = document.getElementById("refreshButton");
    const tableBody = document.getElementById("tableBody");
    const errorBox = document.getElementById("errorBox");

    const numberFormat = new Intl.NumberFormat("es-UY", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    const integerFormat = new Intl.NumberFormat("es-UY", {
      maximumFractionDigits: 0
    });

    function normalizeJsonText(text) {
      // Corrige números inválidos con punto final: 111159.  -> 111159
      return text.replace(/(-?\d+)\.(\s*[,}\]])/g, "$1$2");
    }

    function parseLocalDate(value) {
      if (!value) return null;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function dayKey(value) {
      const date = parseLocalDate(value);
      if (!date) return "";
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatDay(key) {
      if (!key) return "Sin fecha";
      const [y, m, d] = key.split("-");
      return `${d}/${m}/${y}`;
    }

    function formatDateTime(value) {
      const date = parseLocalDate(value);
      if (!date) return value || "—";
      const day = String(date.getDate()).padStart(2, "0");
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const year = date.getFullYear();
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${day}/${month}/${year} ${hour}:${minute}`;
    }

    function displayDestination(value) {
      const original = String(value ?? "").trim();
      const normalized = original
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase();

      if (normalized.includes("POLO LOGISTICO")) return "POLO LOGISTICO";
      if (normalized.includes("UPM") && (normalized.includes("PASO DE LOS TOROS") || normalized.includes("ZONA FRANCA"))) {
        return "UPM - PDT";
      }
      return original || "—";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getNet(record) {
      const raw = record["YA ENVIADOS.Neto"];
      if (typeof raw === "number") return Number.isFinite(raw) ? raw : 0;
      const parsed = Number(String(raw ?? "").replace(",", "."));
      return Number.isFinite(parsed) ? parsed : 0;
    }

    async function loadData() {
      errorBox.style.display = "none";
      refreshButton.disabled = true;
      refreshButton.textContent = "Actualizando...";
      tableBody.innerHTML = '<tr><td colspan="9" class="loading">Cargando datos...</td></tr>';

      try {
        const separator = DATA_URL.includes("?") ? "&" : "?";
        const response = await fetch(`${DATA_URL}${separator}_=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Dropbox respondió con estado ${response.status}`);

        const rawText = await response.text();
        const data = JSON.parse(normalizeJsonText(rawText));

        allRecords = Array.isArray(data.registros) ? data.registros : [];
        document.getElementById("updatedText").textContent = data.actualizado
          ? `Datos actualizados: ${formatDateTime(data.actualizado)}`
          : "Fecha de actualización no disponible";

        buildDestinationButtons();
        buildStatusButtons();
        buildDays();
        applyFilters();
      } catch (error) {
        allRecords = [];
        errorBox.style.display = "block";
        errorBox.innerHTML = `<strong>No fue posible cargar el JSON.</strong><br>${escapeHtml(error.message)}<br><span class="muted">Verificá que el enlace de Dropbox sea público y que el archivo contenga un JSON válido.</span>`;
        document.getElementById("updatedText").textContent = "Sin datos disponibles";
        tableBody.innerHTML = '<tr><td colspan="9" class="loading">No se pudieron cargar los registros.</td></tr>';
        updateCards([]);
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "Actualizar datos";
      }
    }

    function buildDestinationButtons() {
      const destinations = [...new Set(allRecords.map(r => String(r.DESTINO ?? "").trim()).filter(Boolean))]
        .sort((a, b) => displayDestination(a).localeCompare(displayDestination(b), "es"));

      if (selectedDestination && !destinations.includes(selectedDestination)) selectedDestination = "";

      destinationsContainer.innerHTML = [
        `<option value="">Todos los destinos</option>`,
        ...destinations.map(destination =>
          `<option value="${escapeHtml(destination)}" ${selectedDestination === destination ? "selected" : ""}>${escapeHtml(displayDestination(destination))}</option>`
        )
      ].join("");

      destinationsContainer.onchange = () => {
        selectedDestination = destinationsContainer.value || "";
        applyFilters();
      };
    }

    function buildStatusButtons() {
      const statuses = [...new Set(allRecords
        .map(r => String(r["ESTADO DESCARGA"] ?? "").trim())
        .filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "es"));

      if (selectedStatus && !statuses.includes(selectedStatus)) selectedStatus = "";

      statusContainer.innerHTML = [
        `<option value="">Todos los estados</option>`,
        ...statuses.map(status =>
          `<option value="${escapeHtml(status)}" ${selectedStatus === status ? "selected" : ""}>${escapeHtml(status)}</option>`
        )
      ].join("");

      statusContainer.onchange = () => {
        selectedStatus = statusContainer.value || "";
        applyFilters();
      };
    }

    function buildDays() {
      const days = [...new Set(allRecords.map(r => dayKey(r["FIN CARGA"])).filter(Boolean))]
        .sort((a, b) => b.localeCompare(a));

      if (selectedDay && !days.includes(selectedDay)) selectedDay = "";

      daysContainer.innerHTML = [
        `<option value="">Todos los días</option>`,
        ...days.map(day =>
          `<option value="${day}" ${selectedDay === day ? "selected" : ""}>${formatDay(day)}</option>`
        )
      ].join("");

      daysContainer.onchange = () => {
        selectedDay = daysContainer.value || "";
        applyFilters();
      };
    }

    function applyFilters() {
      const destination = selectedDestination;
      const filtered = allRecords.filter(record => {
        const matchDay = !selectedDay || dayKey(record["FIN CARGA"]) === selectedDay;
        const matchDestination = !destination || String(record.DESTINO ?? "") === destination;
        const matchStatus = !selectedStatus || String(record["ESTADO DESCARGA"] ?? "").trim() === selectedStatus;
        return matchDay && matchDestination && matchStatus;
      });

      filtered.sort((a, b) => {
        const dateA = parseLocalDate(a["FIN CARGA"])?.getTime() || 0;
        const dateB = parseLocalDate(b["FIN CARGA"])?.getTime() || 0;
        return dateB - dateA;
      });

      updateCards(filtered);
      renderTable(filtered);
    }

    function updateCards(records) {
      const pending = records.filter(r => !isDownloaded(r["ESTADO DESCARGA"]));

      document.getElementById("recordsCard").textContent = integerFormat.format(records.length);
      document.getElementById("pendingCard").textContent = integerFormat.format(pending.length);
      document.getElementById("tableCount").textContent = `${integerFormat.format(records.length)} registros`;
    }


    function normalizeStatus(value) {
      return String(value ?? "")
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase();
    }

    function isDownloaded(value) {
      const status = normalizeStatus(value);
      return status === "DESCARGO" || status === "DESCARGADO" || status === "DESCARGADA";
    }
    function renderTable(records) {
      if (!records.length) {
        tableBody.innerHTML = '<tr><td colspan="9" class="loading">No hay registros para los filtros seleccionados.</td></tr>';
        return;
      }

      tableBody.innerHTML = records.map(record => {
        const statusText = String(record["ESTADO DESCARGA"] ?? "—");
        const statusUpper = statusText.toUpperCase();
        const statusClass = isDownloaded(statusText) ? "ok" : "warn";
        const observation = record.OBSERVACIONES == null || String(record.OBSERVACIONES).toLowerCase() === "nan"
          ? "—"
          : record.OBSERVACIONES;

        return `
          <tr>
            <td>${escapeHtml(record["REMITO MONTE"] ?? "—")}</td>
            <td class="text-left">${escapeHtml(displayDestination(record.DESTINO))}</td>
            <td class="text-left">${escapeHtml(record.PREDIO ?? "—")}</td>
            <td class="text-left">${escapeHtml(record.PRODUCTO ?? "—")}</td>
            <td>${escapeHtml(record["VEHÍCULO"] ?? "—")}</td>
            <td>${escapeHtml(formatDateTime(record["FIN CARGA"]))}</td>
            <td>${escapeHtml(observation)}</td>
            <td>${numberFormat.format(getNet(record))}</td>
            <td><span class="status ${statusClass}">${escapeHtml(statusText)}</span></td>
          </tr>`;
      }).join("");
    }

    clearButton.addEventListener("click", () => {
      selectedDay = "";
      selectedDestination = "";
      selectedStatus = "";
      buildDays();
      buildDestinationButtons();
      buildStatusButtons();
      applyFilters();
    });

    refreshButton.addEventListener("click", loadData);

    loadData();
  </script>
</body>
</html>
